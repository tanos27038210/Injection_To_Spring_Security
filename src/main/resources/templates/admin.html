<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>

<body>

<!-- 1. ТЕМНАЯ ШАПКА -->
<header class="navbar navbar-dark bg-dark px-3 mb-4 shadow-sm">
    <div class="text-white">
        <span class="fw-bold" th:text="${admin.email}">admin@admin</span>
        <span>with roles:</span>
        <span th:text="${admin.roles}">[ADMIN]</span>
    </div>

    <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-dark text-secondary border-0">Logout</button>
    </form>
</header>

<!-- ОСНОВНОЙ КОНТЕЙНЕР С СЕТКОЙ -->
<div class="container-fluid">
    <div class="row">

        <!-- ЛЕВАЯ БОКОВАЯ ПАНЕЛЬ -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse px-0 vh-100 pt-3 border-end">
            <div class="position-sticky">
                <div class="list-group list-group-flush rounded-0">
                    <a href="/admin" class="list-group-item list-group-item-action active py-2">Admin</a>
                    <a href="/user" class="list-group-item list-group-item-action py-2">User</a>
                </div>
            </div>
        </nav>

        <!-- ПРАВАЯ ЧАСТЬ С КОНТЕНТОМ -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4">

            <!-- Заголовок панели -->
            <h1 class="mb-4">Admin panel</h1>

            <!-- Вкладки (Tabs) -->
            <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="all-users-tab" data-bs-toggle="tab" data-bs-target="#all-users-pane" type="button" role="tab">All Users</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="new-user-tab" data-bs-toggle="tab" data-bs-target="#new-user-pane" type="button" role="tab">New User</button>
                </li>
            </ul>

            <!-- КОНТЕНТ ВКЛАДОК -->
            <div class="tab-content" id="adminTabsContent">

                <!-- Вкладка 1: Таблица всех пользователей -->
                <div class="tab-pane fade show active" id="all-users-pane" role="tabpanel">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white fw-bold py-3">All Users</div>
                        <div class="card-body">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}">1</td>
                                    <td th:text="${user.firstname}">Firstname</td>
                                    <td th:text="${user.lastname}">Lastname</td>
                                    <td th:text="${user.age}">28</td>
                                    <td th:text="${user.email}">email@mail.com</td>
                                    <td th:text="${user.roles}">[ADMIN]</td>

                                    <!-- Кнопка Edit и модальное окно -->
                                    <td>
                                        <button type="button" class="btn btn-info btn-sm text-white"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="${'#editModal' + user.id}">
                                            Edit
                                        </button>

                                        <div class="modal fade" th:id="${'editModal' + user.id}" tabindex="-1" aria-hidden="true">
                                            <div class="modal-dialog">
                                                <div class="modal-content">
                                                    <form th:action="@{/admin/edit}" method="post">
                                                        <div class="modal-header">
                                                            <h5 class="modal-title">Edit user</h5>
                                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                        </div>
                                                        <div class="modal-body text-center" style="max-width: 400px; margin: 0 auto;">
                                                            <input type="hidden" name="id" th:value="${user.id}">

                                                            <div class="mb-3 text-start">
                                                                <label class="form-label fw-bold">First Name</label>
                                                                <input type="text" class="form-control" name="firstname" th:value="${user.firstname}" required>
                                                            </div>
                                                            <div class="mb-3 text-start">
                                                                <label class="form-label fw-bold">Last Name</label>
                                                                <input type="text" class="form-control" name="lastname" th:value="${user.lastname}" required>
                                                            </div>
                                                            <div class="mb-3 text-start">
                                                                <label class="form-label fw-bold">Age</label>
                                                                <input type="number" class="form-control" name="age" th:value="${user.age}" required>
                                                            </div>
                                                            <div class="mb-3 text-start">
                                                                <label class="form-label fw-bold">Email</label>
                                                                <input type="email" class="form-control" name="email" th:value="${user.email}" required>
                                                            </div>
                                                            <div class="mb-3 text-start">
                                                                <label class="form-label fw-bold">Password</label>
                                                                <input type="password" class="form-control" name="password" placeholder="Leave blank if not changing">
                                                            </div>
                                                            <div class="mb-3 text-start">
                                                                <label class="form-label fw-bold">Role</label>
                                                                <select class="form-select" name="roles" multiple size="2" required>
                                                                    <option value="1">ADMIN</option>
                                                                    <option value="2">USER</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="modal-footer">
                                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                                            <button type="submit" class="btn btn-primary">Edit</button>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </td>

                                    <!-- Кнопка Delete -->
                                    <td>
                                        <form th:action="@{/admin/delete/{id}(id=${user.id})}" method="post">
                                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Вкладка 2: Форма добавления нового пользователя -->
                <div class="tab-pane fade" id="new-user-pane" role="tabpanel">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white fw-bold py-3">Add new user</div>
                        <div class="card-body bg-white">
                            <div class="col-md-4 mx-auto text-center py-3">
                                <form th:action="@{/admin}" method="post">

                                    <div class="mb-3 text-start">
                                        <label for="new-name" class="form-label fw-bold">First Name</label>
                                        <input type="text" id="new-name" name="firstname" class="form-control" placeholder="First Name" required>
                                    </div>

                                    <div class="mb-3 text-start">
                                        <label for="new-lastname" class="form-label fw-bold">Last Name</label>
                                        <input type="text" id="new-lastname" name="lastname" class="form-control" placeholder="Last Name" required>
                                    </div>

                                    <div class="mb-3 text-start">
                                        <label for="new-age" class="form-label fw-bold">Age</label>
                                        <input type="number" id="new-age" name="age" class="form-control" placeholder="Age" required>
                                    </div>

                                    <div class="mb-3 text-start">
                                        <label for="new-email" class="form-label fw-bold">Email</label>
                                        <input type="email" id="new-email" name="email" class="form-control" placeholder="Email" required>
                                    </div>

                                    <div class="mb-3 text-start">
                                        <label for="new-password" class="form-label fw-bold">Password</label>
                                        <input type="password" id="new-password" name="password" class="form-control" placeholder="Password" required>
                                    </div>

                                    <div class="mb-3 text-start">
                                        <label for="new-roles" class="form-label fw-bold">Role</label>
                                        <select id="new-roles" name="roles" class="form-select" multiple size="2" required>
                                            <option value="1">ADMIN</option>
                                            <option value="2">USER</option>
                                        </select>
                                    </div>

                                    <button type="submit" class="btn btn-success text-white px-4">Add new user</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div> <!-- Конец tab-content -->

        </main>
    </div>
</div> <!-- Конец container-fluid -->

<!-- Подключаем скрипты Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</body>
</html>
