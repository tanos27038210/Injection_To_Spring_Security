<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>

<!--connecting Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>

<body>

<!--Main container for side padding-->
<div class="container mt-4">

    <!--Panel title-->
    <h1 class="mb-4 text-center">Administrator panel</h1>
    <h2 class="mb-3">User`s list</h2>

<!--adding class table, table-striped, table-hover-->
<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Name</th>
        <th>Lastname</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">123</td>
        <td th:text="${user.username}">user</td>
        <td th:text="${user.name}">Name</td>
        <td th:text="${user.lastname}">Lastname</td>
        <td th:text="${user.email}">eddy.@gmail.com</td>

        <!-- Кнопка вызова модального окна Edit и само модальное окно внутри одной ячейки -->
        <td>
            <button type="button" class="btn btn-info btn-sm text-white"
                    data-bs-toggle="modal"
                    th:data-bs-target="${'#editModal' + user.id}">
                Edit
            </button>

            <!-- Модальное окно -->
            <div class="modal fade" th:id="${'editModal' + user.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form th:action="@{/admin/edit}" method="post">
                            <div class="modal-header">
                                <h5 class="modal-title">Edit user</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body text-start" style="max-width: 400px; margin: 0 auto;">
                                <input type="hidden" name="id" th:value="${user.id}">

                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" name="username" th:value="${user.username}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" name="password" placeholder="Leave blank if not changing">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" name="name" th:value="${user.name}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Lastname</label>
                                    <input type="text" class="form-control" name="lastname" th:value="${user.lastname}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" th:value="${user.email}" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </td>

        <td>
            <form th:action="@{/admin/delete/{id}(id=${user.id})}" method="post">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<hr class="my-4">
<h2 class="mb-3">Add new user</h2>

    <!--Wrap form to limit width-->
<div class="card p-4 shadow-sm" style="max-width: 500px;">
    <form th:action="@{/admin}" method="post">

        <div class="mb-3">
            <label for="new-username" class="form-label">Username:</label>
            <input type="text" id="new-username" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="new-password" class="form-label">Password:</label>
            <input type="password" id="new-password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="new-name" class="form-label">Name:</label>
            <input type="text" id="new-name" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="new-lastname" class="form-label">Lastname:</label>
            <input type="text" id="new-lastname" name="lastname" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="new-email" class="form-label">Email:</label>
            <input type="email" id="new-email" name="email" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Save</button>
        </form>
</div>

        <br>

<!--Exit button from account-->
        <hr>
        <form th:action="@{/logout}" method="post" class="mt-3">
            <button type="submit" class="btn btn-secondary">Account exit</button>
        </form>

</div> <!--closed main container opened at the beginning-->

<!--connecting scripts Bootstrap-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</body>
</html>
