<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User page</title>
    <!--connecting Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>

<body>

<div class="container mt-4">
    <h1 class="mb-4 text-center">User information-page</h1>

    <h2 class="mb-3">About user</h2>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Name</th>
            <th>Lastname</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <!-- Обрати внимание: здесь нет цикла th:each, выводим данные конкретного объекта user -->
        <tr>
            <td th:text="${user.id}">123</td>
            <td th:text="${user.username}">user</td>
            <td th:text="${user.name}">Name</td>
            <td th:text="${user.lastname}">Lastname</td>
            <td th:text="${user.email}">eddy.@gmail.com</td>
        </tr>
        </tbody>
    </table>

    <hr>
    <!-- Кнопка выхода из аккаунта -->
    <form th:action="@{/logout}" method="post" class="mt-3">
        <button type="submit" class="btn btn-secondary">Account exit</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
