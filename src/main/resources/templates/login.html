<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Вход</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<!--добавились классы для фона, центрирования и высоты экрана-->
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<!--Added open card tag-->
<div class="card shadow p-4" style="width: 400px;">
    <!--added class center margin-->
        <h3 class="text-center mb-4">Авторизация</h3>

<!-- Ошибки авторизации обернули в классы алертов -->
<div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
    Неверный логин или пароль!
</div>

<!-- Уведомление о выходе (требуется по ТЗ для logout) -->
<div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
    Вы успешно вышли.
</div>

<!-- Форма входа -->
<form th:action="@{/login}" method="post">
    <div class="mb-3">
        <label for="username" class="form-label">Username:</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="input login" required/>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="input password" required/>
    </div>

    <button type="submit" class="btn btn-primary w-100"> Войти</button>
</form>
</div>

<!-- Подключаем скрипты Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</body>
</html>
